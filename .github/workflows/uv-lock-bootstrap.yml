# Temporary, narrowly scoped bootstrap: create the actual uv.lock in GitHub
# runner, never fabricate or hand-edit lockfile content.
# Remove this workflow after it has committed uv.lock to the PR branch.
name: Bootstrap uv lock (one-off)
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths: ["pyproject.toml"]

permissions:
  contents: write

jobs:
  create-lock:
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'chore/uv-first-modernization' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the internal PR branch (no forks)
        uses: actions/checkout@v4
        with:
          ref: chore/uv-first-modernization
          persist-credentials: true
      - name: Install pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.0"
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Resolve and generate uv.lock
        env:
          UV_HTTP_TIMEOUT: "45"
        run: |
          uv lock
          uv lock --check
          test -s uv.lock
      - name: Commit generated lock (no application code changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: commit uv-generated cross-platform dependency lock"
            git push origin HEAD:chore/uv-first-modernization
          fi
