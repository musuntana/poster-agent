name: CI

# Never run on each push, and never rerun automatically on PR synchronize.
# Normal path: draft PR -> Ready for review => ONE quick validation.
# Revalidate after further changes: remove/reapply "ci:run" label, or dispatch
# from Actions -> CI -> Run workflow, selecting the target branch.
on:
  workflow_dispatch:
    inputs:
      level:
        description: "quick = syntax + pytest; full = benchmarks, rendered images and artifact"
        type: choice
        required: true
        default: quick
        options:
          - quick
          - full
  pull_request:
    types: [ready_for_review, labeled]
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "evals/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci.yml"
      - ".github/workflows/real-ocr.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    # Other label changes do not allocate a runner. Only ci:run asks for tests.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.action == 'ready_for_review' ||
          (github.event.action == 'labeled' && github.event.label.name == 'ci:run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup pinned uv and reuse dependency cache
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.0"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned project Python
        run: uv python install 3.12
      - name: Install Chinese fonts
        timeout-minutes: 4
        run: |
          if fc-list :lang=zh 2>/dev/null | grep -q .; then
            echo "CJK fonts are already available on this runner."
          else
            sudo apt-get update
            # The renderer already supports this lightweight Ubuntu font path.
            # Avoid downloading the 61 MB Noto CJK package on every fresh runner.
            sudo apt-get install -y --no-install-recommends fonts-wqy-microhei
          fi
      - name: Verify lock and install base + dev environment
        run: |
          uv lock --check
          uv sync --locked
      - name: Ruff safety lint (no wholesale style rewrite)
        run: uv run --locked ruff check app tests scripts evals
      - name: Check tracked secrets and local customer data (no network)
        run: uv run --locked python -m scripts.check_repository_readiness
      - name: Validate Python syntax
        run: uv run --locked python -m compileall -q app tests scripts evals
      - name: Run pytest (no external model calls)
        run: uv run --locked python -m pytest -q

      # Heavy verification is EXPLICIT only: never run on PR or each push.
      - name: Replay synthetic OCR benchmark (no OCR model)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.level == 'full' }}
        run: uv run --locked python -m scripts.evaluate_acceptance --output-dir /tmp/poster-agent-benchmark
      - name: OCR environment diagnostic (NO model inference)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.level == 'full' }}
        run: uv run --locked python -m scripts.ocr_probe --output /tmp/ocr_runtime_diagnosis.json
      - name: Render 20 PNG fixtures and assert no-OCR abstention
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.level == 'full' }}
        run: uv run --locked python -m scripts.run_image_benchmark --ocr none
      - name: Upload code-rendered PNG fixtures and offline benchmark
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.level == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: m3b-rendered-png-fixtures
          path: data/eval_runs/m3b_images/
          retention-days: 3
      - name: Generate deterministic demo
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.level == 'full' }}
        run: uv run --locked python -m scripts.generate_demo
