name: Bug report / 缺陷反馈
description: Report a reproducible defect without exposing private data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, customer images, private batch journals, personal data, or vulnerability exploitation details.
        This project is a local demo; synthetic/mock evidence must be distinguished from real-model and human-review evidence.
        For security issues, follow SECURITY.md and do not post exploit details publicly.
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Include the exact commit SHA when possible.
      placeholder: "main @ <commit-sha>"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Linux x86_64
        - Windows / WSL
        - GitHub Actions
        - Other
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: false
  - type: input
    id: uv_version
    attributes:
      label: uv version
      placeholder: "uv --version"
    validations:
      required: false
  - type: dropdown
    id: background_mode
    attributes:
      label: Background mode
      options:
        - local
        - ai
        - unknown
    validations:
      required: false
  - type: dropdown
    id: ocr_status
    attributes:
      label: OCR execution status
      options:
        - Not run
        - Mock or synthetic
        - Real PaddleOCR inference
        - Failed or unavailable
        - Unknown
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic or explicitly authorized sample data only.
      placeholder: "1. Run ...\n2. Open ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs and evidence
      description: Include exact commands and test results. Remove secrets, customer data, and private paths.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, customer data, and unauthorized assets from this report.
          required: true
        - label: I distinguished mock/synthetic evidence from real-model or human-review evidence.
          required: true
